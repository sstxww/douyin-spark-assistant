name: 网页版 · 每日火花助手
run-name: "${{ github.event_name == 'schedule' && '每日计划' || inputs.mode }} · ${{ github.event_name == 'schedule' && 'all' || inputs.account }} · ${{ github.event_name == 'schedule' && '自动' || inputs.revision }}"
on:
  schedule:
    - cron: '17 0 * * *' # managed-spark-morning
    - cron: '17 12 * * *' # managed-spark-schedule
  workflow_dispatch:
    inputs:
      mode:
        description: 'check 只检查；send 复用已保存配置发送'
        type: choice
        options: [check, send]
        default: check
        required: true
      account:
        description: 'all 全部已启用账号；a1/a2/a3 对应私有面板账号卡片'
        type: choice
        options: [all, a1, a2, a3]
        default: all
        required: true
      revision:
        description: '保留 current；私有面板自动填写配置版本。不要填写昵称、文案或 Cookie。'
        type: string
        default: current
        required: true
permissions:
  contents: read
concurrency:
  group: spark-${{ github.repository }}
  cancel-in-progress: false
jobs:
  spark:
    if: github.event_name == 'workflow_dispatch' || vars.SPARK_WEB_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read # Bind re-runs to the original creation date and time slot.
    steps:
      - name: 获取代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装浏览器
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 执行保存的账号与文案（不会显示私人数据）
        env:
          SPARK_WEB_MANIFEST: ${{ secrets.SPARK_WEB_MANIFEST }}
          SPARK_WEB_A1: ${{ secrets.SPARK_WEB_A1 }}
          SPARK_WEB_A2: ${{ secrets.SPARK_WEB_A2 }}
          SPARK_WEB_A3: ${{ secrets.SPARK_WEB_A3 }}
          SPARK_WEB_ENABLED: ${{ vars.SPARK_WEB_ENABLED }}
          SPARK_SCHEDULE: ${{ github.event.schedule }}
          SPARK_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          SPARK_ACCOUNT: ${{ github.event_name == 'schedule' && 'all' || inputs.account }}
          SPARK_REVISION: ${{ github.event_name == 'schedule' && 'current' || inputs.revision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python run_web.py
# Never put a login preview, cookie, config, backup or raw exception in artifacts/logs.
# No pull_request_target, issue-driven config, external tunnel, or CAPTCHA bypass.
