name: 测试与安全回归
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q spark webui run.py run_web.py setup_gui.py
      - name: 配置、去重与模拟聊天页测试（不会访问抖音）
        run: python -m unittest discover -s tests -v
      - name: 配置台浏览器交互回归（虚构数据）
        run: python scripts/check_web_ui.py
  codespaces-image:
    name: Codespaces 镜像安装检查（无账号）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 验证首次安装脚本与内置浏览器
        run: bash .devcontainer/install.sh
      - name: 验证配置台接口和虚构账号测试
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: 配置台浏览器交互回归（镜像环境）
        run: .venv/bin/python scripts/check_web_ui.py
